<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small Goods Gym — Live Interactive Demo Suite</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom range slider */
    input[type=range]::-webkit-slider-thumb {
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #8b5cf6;
      border: 2px solid #ffffff;
      cursor: pointer;
      -webkit-appearance: none;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
    }

    /* Phone Mockup Frame */
    .phone-bezel {
      width: 390px;
      height: 780px;
      background: #020617;
      border: 10px solid #1e293b;
      border-radius: 48px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .dynamic-island {
      width: 110px;
      height: 28px;
      background: #000000;
      border-radius: 20px;
      margin: 10px auto 4px;
      z-index: 50;
      flex-shrink: 0;
    }

    .phone-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 24px;
      -webkit-overflow-scrolling: touch;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    // --- MOCK DATA ---
    const ATHLETES = [
      {
        id: "ath-001",
        name: "Joel Mullen (Founder/Coach)",
        heightCm: 182.0,
        femurCm: 53.5,
        torsoCm: 48.0,
        armSpanCm: 188.5,
        primarySport: "Powerlifting",
        activeRehab: false
      },
      {
        id: "ath-002",
        name: "Holly Hunt (Physio/Coach)",
        heightCm: 168.0,
        femurCm: 43.0,
        torsoCm: 45.0,
        armSpanCm: 164.0,
        primarySport: "Olympic Weightlifting",
        activeRehab: false
      },
      {
        id: "ath-003",
        name: "Alex Carter (Club Lifter)",
        heightCm: 178.0,
        femurCm: 51.0,
        torsoCm: 43.0,
        armSpanCm: 180.0,
        primarySport: "Powerlifting",
        activeRehab: true,
        rehabNotes: "Active shoulder impingement — modify overhead jerks & high bar squat bar placement."
      },
      {
        id: "ath-004",
        name: "'P' (NDIS Participant / World Champ)",
        heightCm: 172.0,
        femurCm: 46.0,
        torsoCm: 45.0,
        armSpanCm: 174.0,
        primarySport: "Capacity Building / Masters Powerlifting",
        activeRehab: true,
        rehabNotes: "Post-rotator cuff rehab. Focus on unilateral stability and controlled tempo."
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("logger"); // logger | biomech | rsvp | ndis | arch
      const [selectedAthlete, setSelectedAthlete] = useState(ATHLETES[2]); // Alex
      const [isWidgetOpen, setIsWidgetOpen] = useState(false);

      return (
        <div className="min-h-screen flex flex-col bg-[#090d16]">
          {/* TOP NAVBAR */}
          <header className="border-b border-slate-800/80 bg-slate-950/95 backdrop-blur-md sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex items-center justify-between gap-4">
              {/* BRANDING */}
              <div className="flex items-center space-x-3 shrink-0">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-black text-white text-lg tracking-wider shadow-lg shadow-purple-900/40 shrink-0">
                  SG
                </div>
                <div className="flex flex-col justify-center">
                  <div className="flex items-center space-x-2 whitespace-nowrap">
                    <span className="font-extrabold text-white text-base tracking-tight whitespace-nowrap">Small Goods Gym</span>
                    <span className="bg-purple-900/50 border border-purple-500/40 text-purple-300 text-[10px] font-bold px-2 py-0.5 rounded-full font-mono whitespace-nowrap">LIVE DEMO</span>
                  </div>
                  <span className="text-[11px] text-slate-400 font-medium whitespace-nowrap">Morley, Perth • High-Performance Systems</span>
                </div>
              </div>

              {/* NAV TABS */}
              <nav className="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-800 shrink-0 space-x-1 overflow-x-auto">
                <button 
                  onClick={() => setActiveTab("logger")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center space-x-1.5 shrink-0 ${activeTab === 'logger' ? 'bg-purple-600 text-white shadow-md shadow-purple-900/50' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'}`}
                >
                  <span>📱</span>
                  <span>Athlete Logger</span>
                </button>

                <button 
                  onClick={() => setActiveTab("biomech")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center space-x-1.5 shrink-0 ${activeTab === 'biomech' ? 'bg-purple-600 text-white shadow-md shadow-purple-900/50' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'}`}
                >
                  <span>📐</span>
                  <span>Coach Leverages</span>
                </button>

                <button 
                  onClick={() => setActiveTab("rsvp")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center space-x-1.5 shrink-0 ${activeTab === 'rsvp' ? 'bg-purple-600 text-white shadow-md shadow-purple-900/50' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'}`}
                >
                  <span>🎟️</span>
                  <span>RSVP & Waitlist</span>
                </button>

                <button 
                  onClick={() => setActiveTab("ndis")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center space-x-1.5 shrink-0 ${activeTab === 'ndis' ? 'bg-purple-600 text-white shadow-md shadow-purple-900/50' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'}`}
                >
                  <span>🩺</span>
                  <span>NDIS Analytics</span>
                </button>

                <button 
                  onClick={() => setActiveTab("arch")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center space-x-1.5 shrink-0 ${activeTab === 'arch' ? 'bg-purple-600 text-white shadow-md shadow-purple-900/50' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'}`}
                >
                  <span>🔌</span>
                  <span>Javier Handshake</span>
                </button>

                <button 
                  onClick={() => setActiveTab("goat")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-black whitespace-nowrap transition-all flex items-center space-x-1.5 shrink-0 ${activeTab === 'goat' ? 'bg-[#9aef0f] text-black shadow-md shadow-lime-900/40' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
                >
                  <span>🐐</span>
                  <span>Goat AI Co-Pilot</span>
                </button>
              </nav>

              {/* ATHLETE QUICK SELECT */}
              <div className="flex items-center space-x-2 whitespace-nowrap shrink-0 text-xs">
                <span className="text-slate-400 font-semibold whitespace-nowrap">Viewing as:</span>
                <select 
                  value={selectedAthlete.id}
                  onChange={(e) => setSelectedAthlete(ATHLETES.find(a => a.id === e.target.value))}
                  className="bg-slate-900 border border-slate-700 hover:border-slate-600 text-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-medium focus:outline-none focus:border-purple-500 whitespace-nowrap cursor-pointer"
                >
                  {ATHLETES.map(a => (
                    <option key={a.id} value={a.id}>{a.name}</option>
                  ))}
                </select>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {activeTab === "logger" && <WorkoutLoggerView athlete={selectedAthlete} />}
            {activeTab === "biomech" && <BiomechanicalView athlete={selectedAthlete} onAthleteChange={setSelectedAthlete} />}
            {activeTab === "rsvp" && <RsvpWaitlistView athlete={selectedAthlete} />}
            {activeTab === "ndis" && <NdisAnalyticsView athlete={selectedAthlete} />}
            {activeTab === "arch" && <ArchitectureView />}
            {activeTab === "goat" && <GoatAiHubView athlete={selectedAthlete} />}
          </main>

          {/* FLOATING GOAT AI WIDGET LAUNCHER & DRAWER */}
          <FloatingGoatWidget athlete={selectedAthlete} isOpen={isWidgetOpen} setIsOpen={setIsWidgetOpen} />
        </div>
      );
    }

    // ==========================================
    // 1. WORKOUT LOGGER (Mobile Mockup View)
    // ==========================================
    function WorkoutLoggerView({ athlete }) {
      const [sets, setSets] = useState([
        { setNumber: 1, targetWeight: 100, targetReps: 5, targetRpe: 7, loggedReps: 5, loggedWeight: 100, loggedRpe: 7, velocity: 0.64, completed: true },
        { setNumber: 2, targetWeight: 100, targetReps: 5, targetRpe: 7, loggedReps: 5, loggedWeight: 100, loggedRpe: 7.5, velocity: 0.59, completed: true },
        { setNumber: 3, targetWeight: 100, targetReps: 5, targetRpe: 8, loggedReps: 5, loggedWeight: 100, loggedRpe: 8, velocity: 0.49, completed: true },
        { setNumber: 4, targetWeight: 100, targetReps: 5, targetRpe: 8, loggedReps: null, loggedWeight: 100, loggedRpe: null, velocity: null, completed: false },
        { setNumber: 5, targetWeight: 100, targetReps: 5, targetRpe: 8, loggedReps: null, loggedWeight: 100, loggedRpe: null, velocity: null, completed: false },
      ]);

      const [activeSetIndex, setActiveSetIndex] = useState(3);
      const [showVideo, setShowVideo] = useState(false);
      const [restTimer, setRestTimer] = useState(null);
      const [vbtReading, setVbtReading] = useState(0.52);

      const completeActiveSet = () => {
        const next = [...sets];
        next[activeSetIndex] = {
          ...next[activeSetIndex],
          loggedReps: next[activeSetIndex].targetReps,
          loggedWeight: next[activeSetIndex].targetWeight,
          loggedRpe: next[activeSetIndex].targetRpe,
          velocity: vbtReading,
          completed: true
        };
        setSets(next);
        setRestTimer(90);
        if (activeSetIndex < sets.length - 1) {
          setActiveSetIndex(activeSetIndex + 1);
        }
      };

      const adjustWeight = (amount) => {
        const next = [...sets];
        next[activeSetIndex].targetWeight = Math.max(0, next[activeSetIndex].targetWeight + amount);
        setSets(next);
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
          {/* LEFT: Live Phone Mockup */}
          <div className="lg:col-span-6 flex justify-center">
            <div className="phone-bezel">
              <div className="dynamic-island"></div>
              
              <div className="phone-content px-4 pt-2">
                {/* Header inside phone */}
                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                  <div>
                    <span className="text-[10px] uppercase font-bold tracking-wider text-purple-400">Block 4 • Day 1</span>
                    <h3 className="text-base font-bold text-white leading-tight">A1. High-Bar Back Squat</h3>
                  </div>
                  <button 
                    onClick={() => setShowVideo(!showVideo)}
                    className="bg-slate-800 hover:bg-slate-700 text-purple-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 flex items-center space-x-1"
                  >
                    <span>▶</span>
                    <span>{showVideo ? "Hide Video" : "Form Video"}</span>
                  </button>
                </div>

                {/* Inline Video Player */}
                {showVideo && (
                  <div className="mb-4 rounded-xl overflow-hidden border border-slate-700 bg-black aspect-video relative flex items-center justify-center">
                    <iframe 
                      src="https://player.vimeo.com/video/1016399622?title=0&byline=0&portrait=0" 
                      className="w-full h-full"
                      frameBorder="0" 
                      allow="autoplay; fullscreen"
                    ></iframe>
                  </div>
                )}

                {/* Biomechanical Stance Cue Badge */}
                <div className="bg-purple-950/40 border border-purple-800/40 rounded-xl p-3 mb-4 flex items-start space-x-2.5">
                  <span className="text-purple-400 text-sm">💡</span>
                  <div className="text-xs text-purple-200 leading-relaxed">
                    <span className="font-semibold text-purple-300">Coach Cue:</span> Long Femurs detected — elevate heels 1cm and maintain 30° toe flair to prevent anterior hip pinch.
                  </div>
                </div>

                {/* Rest Timer Banner */}
                {restTimer !== null && (
                  <div className="bg-emerald-950/50 border border-emerald-500/40 rounded-xl p-3 mb-4 flex items-center justify-between animate-pulse">
                    <div className="flex items-center space-x-2">
                      <span className="text-emerald-400">⏱️</span>
                      <span className="text-xs font-semibold text-emerald-200">Rest Interval Running</span>
                    </div>
                    <span className="font-mono text-sm font-bold text-emerald-400">{restTimer}s</span>
                  </div>
                )}

                {/* ACTIVE SET CARD (Single Movement Focus - Hick's Law) */}
                <div className="bg-slate-900 border-2 border-purple-500/80 rounded-2xl p-4 mb-4 shadow-xl shadow-purple-950/30">
                  <div className="flex items-center justify-between mb-3">
                    <span className="bg-purple-600 text-white text-xs font-bold px-2 py-0.5 rounded-md">
                      ACTIVE SET {activeSetIndex + 1} OF 5
                    </span>
                    <span className="text-xs font-mono text-slate-400">Target: RPE {sets[activeSetIndex]?.targetRpe}</span>
                  </div>

                  <div className="grid grid-cols-2 gap-3 mb-4">
                    {/* Weight Control */}
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                      <div className="text-[11px] text-slate-400 uppercase font-semibold">Load (kg)</div>
                      <div className="text-2xl font-black text-white my-1 font-mono">
                        {sets[activeSetIndex]?.targetWeight}
                      </div>
                      <div className="flex justify-center space-x-1.5 mt-1">
                        <button onClick={() => adjustWeight(-2.5)} className="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded font-bold text-slate-200 active:scale-95 transition">-2.5</button>
                        <button onClick={() => adjustWeight(2.5)} className="bg-purple-700 hover:bg-purple-600 text-xs px-2.5 py-1 rounded font-bold text-white active:scale-95 transition">+2.5</button>
                        <button onClick={() => adjustWeight(5)} className="bg-purple-600 hover:bg-purple-500 text-xs px-2.5 py-1 rounded font-bold text-white active:scale-95 transition">+5</button>
                      </div>
                    </div>

                    {/* Reps Control */}
                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                      <div className="text-[11px] text-slate-400 uppercase font-semibold">Prescribed</div>
                      <div className="text-2xl font-black text-purple-400 my-1 font-mono">
                        {sets[activeSetIndex]?.targetReps} <span className="text-xs text-slate-400">reps</span>
                      </div>
                      <div className="text-[10px] text-slate-500 mt-2">Auto-synced from block</div>
                    </div>
                  </div>

                  {/* Complete Set Action Button (Fitts's Law: 64dp massive touch target) */}
                  <button 
                    onClick={completeActiveSet}
                    className="w-full h-14 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-extrabold rounded-xl text-base shadow-lg shadow-emerald-950/60 flex items-center justify-center space-x-2 active:scale-98 transition duration-150"
                  >
                    <span>✓</span>
                    <span>COMPLETE SET {activeSetIndex + 1}</span>
                  </button>
                </div>

                {/* COMPLETED SETS SUMMARY */}
                <div className="space-y-2">
                  <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Set History</div>
                  {sets.map((s, idx) => (
                    <div 
                      key={idx} 
                      onClick={() => setActiveSetIndex(idx)}
                      className={`p-2.5 rounded-xl border flex items-center justify-between text-xs cursor-pointer transition ${idx === activeSetIndex ? 'border-purple-500 bg-purple-950/30' : s.completed ? 'border-slate-800 bg-slate-900/60' : 'border-slate-900 opacity-40'}`}
                    >
                      <div className="flex items-center space-x-2">
                        <span className={`w-5 h-5 rounded-full flex items-center justify-center font-bold text-[10px] ${s.completed ? 'bg-emerald-500 text-black' : 'bg-slate-800 text-slate-400'}`}>
                          {s.completed ? '✓' : idx + 1}
                        </span>
                        <span className="font-semibold text-slate-200">Set {idx + 1}</span>
                      </div>
                      <div className="font-mono text-slate-300">
                        {s.loggedWeight || s.targetWeight}kg × {s.loggedReps || s.targetReps}
                      </div>
                      <div className="text-[10px] font-mono">
                        {s.velocity ? (
                          <span className="text-cyan-400 font-bold">{s.velocity} m/s</span>
                        ) : (
                          <span className="text-slate-500">RPE {s.targetRpe}</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* RIGHT: Coach Explanation & VBT Simulator */}
          <div className="lg:col-span-6 space-y-6">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
              <span className="text-xs font-bold text-purple-400 uppercase tracking-wider">HCI & Gym Floor Principles</span>
              <h2 className="text-xl font-bold text-white mt-1 mb-3">Why Lifters Love This Interface</h2>
              <ul className="space-y-3 text-sm text-slate-300">
                <li className="flex items-start space-x-2.5">
                  <span className="text-emerald-400 font-bold">✓</span>
                  <span><strong>Fitts's Law (64x64 dp Targets):</strong> Large "+2.5kg" and "Complete Set" buttons eliminate mis-taps when hands are shaking or chalk-covered.</span>
                </li>
                <li className="flex items-start space-x-2.5">
                  <span className="text-emerald-400 font-bold">✓</span>
                  <span><strong>Hick's Law (Zero Cognitive Load):</strong> Displays one movement card at a time rather than a wall of 50 spreadsheet rows.</span>
                </li>
                <li className="flex items-start space-x-2.5">
                  <span className="text-emerald-400 font-bold">✓</span>
                  <span><strong>Doherty Threshold (&lt;400ms):</strong> Instant visual confirmation of set completion prevents double-taps and data corruption.</span>
                </li>
              </ul>
            </div>

            {/* VBT Accelerometer Simulator */}
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <span className="text-xs font-bold text-cyan-400 uppercase tracking-wider">Hardware Telemetry</span>
                  <h3 className="text-lg font-bold text-white">Enode Accelerometer Simulator</h3>
                </div>
                <span className="bg-cyan-950 border border-cyan-500/40 text-cyan-300 text-xs font-mono px-2.5 py-1 rounded-full">
                  LIVE VBT
                </span>
              </div>

              <p className="text-xs text-slate-400 mb-4">
                Simulate bar velocity decay to show how Small Goods Gym coaches intervene before technical failure:
              </p>

              <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-4">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-xs text-slate-400 font-semibold">Mean Concentric Velocity (m/s)</span>
                  <span className="font-mono text-xl font-extrabold text-cyan-400">{vbtReading.toFixed(2)} m/s</span>
                </div>
                <input 
                  type="range" 
                  min="0.30" 
                  max="0.95" 
                  step="0.01" 
                  value={vbtReading} 
                  onChange={(e) => setVbtReading(parseFloat(e.target.value))}
                  className="w-full accent-cyan-400"
                />
                <div className="flex justify-between text-[10px] text-slate-500 font-mono mt-1">
                  <span>0.30 m/s (Grind/Fatigue)</span>
                  <span>0.75 m/s (Threshold)</span>
                  <span>0.95 m/s (Explosive)</span>
                </div>
              </div>

              {vbtReading < 0.50 ? (
                <div className="bg-amber-950/40 border border-amber-600/50 p-3 rounded-xl flex items-center space-x-2 text-xs text-amber-200">
                  <span>⚠️</span>
                  <span><strong>Velocity Decay Alert:</strong> Mean velocity has dropped &gt;20%. System recommends terminating squat block at 3 sets to preserve CNS output.</span>
                </div>
              ) : (
                <div className="bg-emerald-950/40 border border-emerald-600/50 p-3 rounded-xl flex items-center space-x-2 text-xs text-emerald-200">
                  <span>⚡</span>
                  <span><strong>Speed Reserve Optimal:</strong> Velocity above threshold. Proceed with remaining prescribed volume.</span>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. COACH BIOMECHANICAL LEVERAGES
    // ==========================================
    function BiomechanicalView({ athlete, onAthleteChange }) {
      const [femur, setFemur] = useState(athlete.femurCm);
      const [torso, setTorso] = useState(athlete.torsoCm);
      const [height, setHeight] = useState(athlete.heightCm);

      useEffect(() => {
        setFemur(athlete.femurCm);
        setTorso(athlete.torsoCm);
        setHeight(athlete.heightCm);
      }, [athlete]);

      const ratio = useMemo(() => (femur / torso).toFixed(2), [femur, torso]);
      const isLongFemur = ratio > 1.08;

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
          {/* LEFT: Interactive Anthropometry Controls */}
          <div className="lg:col-span-6 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
            <div className="flex items-center justify-between border-b border-slate-800 pb-4">
              <div>
                <span className="text-xs font-bold text-purple-400 uppercase tracking-wider">Coach Calibration Engine</span>
                <h2 className="text-xl font-bold text-white mt-1">{athlete.name}</h2>
              </div>

    // 3. EVENT RSVP & WAITLIST SYSTEM

    function RsvpWaitlistView({ athlete }) {
      const [attendeesCount, setAttendeesCount] = useState(11);
      const [waitlistCount, setWaitlistCount] = useState(2);
      const [userStatus, setUserStatus] = useState("none"); // none | attending | waitlisted
      const [isOffline, setIsOffline] = useState(false);
      const [offlineQueue, setOfflineQueue] = useState([]);
      const maxCapacity = 12;

      const handleRsvp = () => {
        if (isOffline) {
          setOfflineQueue(prev => [...prev, "RSVP_ACTION"]);
          setUserStatus("waitlisted");
          return;
        }

        if (userStatus === "attending") {
          setUserStatus("none");
          setAttendeesCount(prev => prev - 1);
        } else if (userStatus === "waitlisted") {
          setUserStatus("none");
          setWaitlistCount(prev => prev - 1);
        } else {
          if (attendeesCount < maxCapacity) {
            setUserStatus("attending");
            setAttendeesCount(prev => prev + 1);
          } else {
            setUserStatus("waitlisted");
            setWaitlistCount(prev => prev + 1);
          }
        }
      };

      const percent = Math.min(100, Math.round((attendeesCount / maxCapacity) * 100));

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
          <div className="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
            <div className="flex items-center justify-between border-b border-slate-800 pb-4">
              <div>
                <span className="text-xs font-bold text-purple-400 uppercase tracking-wider">Platform Sessions & Events</span>
                <h2 className="text-xl font-bold text-white mt-1">Olympic Weightlifting: Clean & Jerk Workshop</h2>
                <div className="text-xs text-slate-400 mt-1">Saturday, Sep 12 @ 10:00 AM AWST • Small Goods Main Floor</div>
              </div>
              <span className="bg-purple-950 text-purple-300 border border-purple-500/40 text-xs px-2.5 py-1 rounded-full font-mono">
                12-SPOT CAP
              </span>
            </div>

            {/* CAPACITY PROGRESS BAR */}
            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
              <div className="flex justify-between items-center text-xs mb-2">
                <span className="font-semibold text-slate-300">Platform Utilization:</span>
                <span className="font-mono text-purple-400 font-bold">{attendeesCount} / {maxCapacity} Spots Claimed</span>
              </div>
              <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
                <div 
                  className={`h-full transition-all duration-500 ${attendeesCount >= maxCapacity ? 'bg-gradient-to-r from-amber-500 to-rose-500' : 'bg-gradient-to-r from-purple-600 to-indigo-500'}`}
                  style={{ width: `${percent}%` }}
                ></div>
              </div>
              <div className="flex justify-between text-[11px] text-slate-500 font-mono mt-2">
                <span>{attendeesCount >= maxCapacity ? "PLATFORM FULL" : `${maxCapacity - attendeesCount} platforms remaining`}</span>
                <span>Waitlist: {waitlistCount} lifters waiting</span>
              </div>
            </div>

            {/* RSVP ACTION BUTTON */}
            <div className="space-y-3">
              <button 
                onClick={handleRsvp}
                className={`w-full py-4 rounded-xl font-extrabold text-sm transition-all shadow-lg active:scale-98 flex items-center justify-center space-x-2 ${
                  userStatus === 'attending'
                    ? 'bg-rose-950 border border-rose-600 text-rose-200 hover:bg-rose-900'
                    : userStatus === 'waitlisted'
                    ? 'bg-amber-950 border border-amber-600 text-amber-200 hover:bg-amber-900'
                    : attendeesCount < maxCapacity
                    ? 'bg-purple-600 hover:bg-purple-500 text-white shadow-purple-900/50'
                    : 'bg-amber-600 hover:bg-amber-500 text-white shadow-amber-900/50'
                }`}
              >
                {userStatus === 'attending' && <span>✕ CANCEL MY PLATFORM RESERVATION</span>}
                {userStatus === 'waitlisted' && <span>✕ LEAVE WAITLIST (POSITION #1)</span>}
                {userStatus === 'none' && attendeesCount < maxCapacity && <span>🎟️ 1-TAP RSVP FOR PLATFORM</span>}
                {userStatus === 'none' && attendeesCount >= maxCapacity && <span>⏳ JOIN AUTO-PROMOTION WAITLIST</span>}
              </button>

              {userStatus === 'attending' && (
                <div className="bg-emerald-950/40 border border-emerald-500/50 p-3 rounded-xl text-xs text-emerald-200 flex items-center space-x-2">
                  <span>✓</span>
                  <span><strong>Platform Confirmed:</strong> Platform #4 assigned to {athlete.name}. Joel and Holly have your anthropometric profile pre-loaded.</span>
                </div>
              )}

              {userStatus === 'waitlisted' && (
                <div className="bg-amber-950/40 border border-amber-500/50 p-3 rounded-xl text-xs text-amber-200 flex items-center space-x-2">
                  <span>⏳</span>
                  <span><strong>Waitlist Active:</strong> If any lifter drops out &gt;2 hours before the workshop, your spot is automatically booked and confirmed via push notification.</span>
                </div>
              )}
            </div>

            {/* DEAD-ZONE OFFLINE QUEUE TOGGLE */}
            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
              <div>
                <div className="text-xs font-bold text-slate-200">Gym Floor Dead-Zone Simulator</div>
                <div className="text-[11px] text-slate-400">Simulate cellular signal loss inside the concrete facility</div>
              </div>
              <button 
                onClick={() => setIsOffline(!isOffline)}
                className={`px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition ${isOffline ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}

              <div className="text-xs text-rose-400 bg-rose-950/30 p-2.5 rounded-lg border border-rose-900/50">

            <ul className="space-y-3 text-xs text-slate-300">
              <li className="flex items-start space-x-2">
                <span className="text-purple-400 font-bold">1.</span>
                <span><strong>Platform Capacity Enforcement:</strong> Hard 12-person platform cap stops over-booking without Joel needing to count heads manually.</span>
              </li>
              <li className="flex items-start space-x-2">
                <span className="text-purple-400 font-bold">2.</span>
                <span><strong>Instant Auto-Promotion:</strong> When someone drops out, the next person on the waitlist is promoted without back-and-forth messaging.</span>
              </li>
              <li className="flex items-start space-x-2">
                <span className="text-purple-400 font-bold">3.</span>
                <span><strong>Holly's Injury Screening:</strong> If a lifter with an active shoulder or lumbar restriction RSVPs for an overhead jerk workshop, Holly is instantly alerted.</span>
              </li>
