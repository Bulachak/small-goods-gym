        // --- ERROR BOUNDARY TO PREVENT CRASHES ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 bg-rose-950 text-white rounded-lg neo-border max-w-xl mx-auto my-8 text-center space-y-4">
              <h2 className="text-xl font-bold">Runtime Handled Gracefully</h2>
              <p className="text-xs font-mono text-rose-200">{this.state.error?.toString()}</p>
              <button 
                onClick={() => { this.setState({ hasError: false }); window.location.reload(); }} 
                className="px-4 py-2 bg-white text-black font-bold text-xs rounded neo-border"
              >
                Reload View
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

      const [input, setInput] = useState("");
      const [isSending, setIsSending] = useState(false);

        }

        if (isOpen && endRef.current) {

        }
      }, [messages, isOpen]);

      const sendMessage = async (textToSend) => {
        const query = (textToSend || input).trim();
        if (!query) return;
        if (!textToSend) setInput("");

        const newMsgs = [...messages, { sender: "user", text: query }];
        setMessages(newMsgs);
        setIsSending(true);

        let botReply = null;
        try {
          const apiBase = (window.location.port === "8000" || window.location.pathname.includes("/web/")) ? "" : "http://localhost:8000";

            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: query,
              profile_id: "small_goods_gym",
              conversation_history: newMsgs.map(m => ({
                role: m.sender === "user" ? "user" : "assistant",
                content: m.text
              }))
            })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.reply_text) botReply = data.reply_text;
          }
        } catch (e) {}

        if (!botReply) {

            botReply = "⚡ Yuri Verkhoshansky's Shock Method: Amortization phase must remain strictly under 150 milliseconds. Drop height should not exceed 0.75m for speed-strength or 1.10m for maximal RFD. Transition immediately into reactive concentric drive.";

            botReply = "📹 Computer Vision Kinematics (WL Analysis): Calibrated against the standard 450mm IWF bumper plate outer diameter. Filming perpendicular at 90° converts pixels to metric displacement, mapping barbell trajectory, horizontal loop drift, and peak acceleration.";

      const [selectedScreen, setSelectedScreen] = useState(STITCH_SCREENS[0]);
      const [viewport, setViewport] = useState('desktop'); // 'desktop' | 'tablet' | 'mobile'
      const [renderMode, setRenderMode] = useState('interactive'); // 'interactive' | 'screenshot' | 'split'
      const iframeRef = useRef(null);

      // Re-create icons when selection changes
      useEffect(() => {
        if (window.lucide) lucide.createIcons();
      }, [selectedScreen, viewport, renderMode]);

      // Inject theme into iframe when loaded
      const handleIframeLoad = () => {
        try {
          if (iframeRef.current && iframeRef.current.contentDocument) {
            const doc = iframeRef.current.contentDocument;
            if (isDark) {
              doc.documentElement.classList.add('dark');
            } else {
              doc.documentElement.classList.remove('dark');
            }
          }
        } catch (e) {
          console.warn('Iframe theme injection blocked by origin:', e);
        }
      };

      // Also trigger theme sync on theme toggle
      useEffect(() => {
        handleIframeLoad();
      }, [isDark]);

      return (
        <div className="space-y-6">
          {/* STUDIO CONTROL BAR */}
          <div className="bg-white dark:bg-[#0f172a] p-4 rounded-lg neo-border neo-shadow flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-mono font-bold uppercase px-2 py-0.5 bg-brand-lime text-black rounded neo-border">
                  STITCH STUDIO
                </span>
                <span className="text-xs font-mono text-slate-600 dark:text-slate-400">Screen #{selectedScreen.num}</span>
              </div>
              <h2 className="text-lg font-extrabold mt-0.5">{selectedScreen.title}</h2>
            </div>

            {/* Viewport & Render Mode Switchers */}
            <div className="flex flex-wrap items-center gap-3 text-xs font-mono">
              {/* Viewport switch */}
              <div className="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded neo-border">
                <button
                  onClick={() => setViewport('desktop')}
                  className={`px-3 py-1 rounded font-bold flex items-center gap-1.5 ${
                    viewport === 'desktop' ? 'bg-brand-violet text-white neo-shadow-sm' : 'text-slate-600 dark:text-slate-300'
                  }`}
                >
                  <i data-lucide="monitor" className="w-3.5 h-3.5"></i>
                  <span>Desktop</span>
                </button>
                <button
                  onClick={() => setViewport('tablet')}
                  className={`px-3 py-1 rounded font-bold flex items-center gap-1.5 ${
                    viewport === 'tablet' ? 'bg-brand-violet text-white neo-shadow-sm' : 'text-slate-600 dark:text-slate-300'
                  }`}
                >
                  <i data-lucide="tablet" className="w-3.5 h-3.5"></i>
                  <span>Tablet (768)</span>
                </button>
                <button
                  onClick={() => setViewport('mobile')}
                  className={`px-3 py-1 rounded font-bold flex items-center gap-1.5 ${
                    viewport === 'mobile' ? 'bg-brand-violet text-white neo-shadow-sm' : 'text-slate-600 dark:text-slate-300'
                  }`}
                >
                  <i data-lucide="smartphone" className="w-3.5 h-3.5"></i>
                  <span>Mobile PWA</span>
                </button>
              </div>

              {/* Render mode switch */}
              <div className="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded neo-border">
                <button
                  onClick={() => setRenderMode('interactive')}
                  className={`px-3 py-1 rounded font-bold ${
                    renderMode === 'interactive' ? 'bg-brand-lime text-black neo-shadow-sm' : 'text-slate-600 dark:text-slate-300'
                  }`}
                >
                  Live Code
                </button>
                <button
                  onClick={() => setRenderMode('screenshot')}
                  className={`px-3 py-1 rounded font-bold ${
                    renderMode === 'screenshot' ? 'bg-brand-lime text-black neo-shadow-sm' : 'text-slate-600 dark:text-slate-300'
                  }`}
                >
                  Screenshot
                </button>
                <button
                  onClick={() => setRenderMode('split')}
                  className={`px-3 py-1 rounded font-bold ${
                    renderMode === 'split' ? 'bg-brand-lime text-black neo-shadow-sm' : 'text-slate-600 dark:text-slate-300'
                  }`}
                >
                  Side-by-Side
                </button>
              </div>

              {/* Open in new window */}
              <a
                href={selectedScreen.htmlFile}
                target="_blank"
                rel="noreferrer"
                className="neo-btn bg-brand-yellow text-black px-3 py-1.5 rounded font-bold flex items-center gap-1 text-xs"
              >
                <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                <span>Open Raw</span>
              </a>
            </div>
          </div>

          {/* MAIN PREVIEW CONTAINER & SCREEN SELECTOR SIDEBAR */}
          <div className="grid grid-cols-1 xl:grid-cols-4 gap-6">
            {/* Screen Selector Sidebar */}
            <div className="space-y-2 max-h-[850px] overflow-y-auto pr-1">
              <span className="text-xs font-mono font-bold text-slate-500 uppercase tracking-wider block mb-1">
                Select Wireframe Screen ({STITCH_SCREENS.length})
              </span>
              {STITCH_SCREENS.map(sc => (
                <div
                  key={sc.num}
                  onClick={() => setSelectedScreen(sc)}
                  className={`p-3 rounded neo-border cursor-pointer transition-all ${
                    selectedScreen.num === sc.num
                      ? 'bg-brand-purple text-white neo-shadow font-bold'
                      : 'bg-white dark:bg-[#0f172a] hover:bg-slate-100 dark:hover:bg-slate-800'
                  }`}
                >
                  <div className="flex items-center justify-between text-xs font-mono mb-1">
                    <span className="bg-black text-white px-1.5 py-0.2 rounded-sm text-[10px]">#{sc.num}</span>
                    <span className="text-[10px] opacity-80">{sc.category}</span>
                  </div>
                  <h4 className="font-bold text-xs line-clamp-1">{sc.title}</h4>
                  <p className="text-[11px] opacity-75 line-clamp-2 mt-1 leading-snug">{sc.desc}</p>
                </div>
              ))}
            </div>

            {/* Viewport Frame Container */}
            <div className="xl:col-span-3 bg-slate-200 dark:bg-slate-950 p-4 md:p-6 rounded-lg neo-border neo-shadow flex justify-center items-start min-h-[750px] overflow-x-auto">
              <div
                className={`transition-all duration-300 w-full flex justify-center ${
                  viewport === 'mobile'
                    ? 'max-w-[420px]'
                    : viewport === 'tablet'
                    ? 'max-w-[780px]'
                    : 'max-w-full'
                }`}
              >
                {/* Mobile Device Bezel if in Mobile Mode */}
                <div className={`w-full bg-white dark:bg-slate-900 rounded-xl overflow-hidden neo-border neo-shadow-lg ${
                  viewport === 'mobile' ? 'p-2 pt-4 bg-slate-900 dark:bg-black rounded-[40px] border-[4px] border-black' : ''
                }`}>
                  {viewport === 'mobile' && (
                    <div className="w-24 h-4 bg-black rounded-full mx-auto mb-2"></div>
                  )}

                  {/* Render Mode: Interactive Iframe */}
                  {renderMode === 'interactive' && (
                    <iframe
                      ref={iframeRef}
                      src={`${selectedScreen.htmlFile}?v=20260914-v3`}
                      onLoad={handleIframeLoad}
                      className="w-full h-[780px] border-0 rounded bg-white dark:bg-[#090d16]"
                      title={selectedScreen.title}
                    />
                  )}

                  {/* Render Mode: Static High-Res Screenshot */}
                  {renderMode === 'screenshot' && (
                    <div className="h-[780px] overflow-y-auto bg-slate-100 dark:bg-slate-950 p-2">
                      <img
                        src={`${selectedScreen.pngFile}?v=20260914-v3`}
                        alt={selectedScreen.title}
                        className="w-full h-auto object-contain rounded neo-border"
                      />
                    </div>
                  )}

                  {/* Render Mode: Split View */}
                  {renderMode === 'split' && (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 h-[780px]">
                      <div className="flex flex-col h-full">
                        <div className="bg-black text-white text-[10px] font-mono px-2 py-1 font-bold">
                          LIVE SANDBOX IFRAME
                        </div>
                        <iframe
                          ref={iframeRef}
                          src={`${selectedScreen.htmlFile}?v=20260914-v3`}
                          onLoad={handleIframeLoad}
                          className="w-full flex-1 border-0 bg-white dark:bg-[#090d16]"
                          title={`Live - ${selectedScreen.title}`}
                        />
                      </div>
                      <div className="flex flex-col h-full overflow-hidden">
                        <div className="bg-black text-white text-[10px] font-mono px-2 py-1 font-bold">
                          HIGH-RES DESIGN SCREENSHOT
                        </div>
                        <div className="flex-1 overflow-y-auto bg-slate-950 p-2">
                          <img
                            src={`${selectedScreen.pngFile}?v=20260914-v3`}
                            alt={selectedScreen.title}
                            className="w-full h-auto object-contain"
                          />
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODE 3: SMALL GOODS DESIGN SYSTEM & TOKEN SPEC
    // =========================================================================
    function DesignSystemView({ isDark }) {
      const colors = [
        { name: 'Royal Purple', token: '--purple-heart', hex: '#4724ba', desc: 'Core brand identity & primary headings' },
        { name: 'Electric Violet', token: '--electric-violet', hex: '#6a3cf4', desc: 'Interactive primary buttons & active navigation' },
        { name: 'Acid Lime', token: '--inch-worm', hex: '#9aef0f', desc: 'Success confirmation, finished reps, VBT zone' },
        { name: 'Mandy Coral', token: '--mandy', hex: '#e95766', desc: 'Fatigue warning, acute injury alerts, triage flags' },
        { name: 'Sweet Corn', token: '--sweet-corn', hex: '#f8ef8d', desc: 'Coach tip callout cards & marginalia' },
        { name: 'Golden Fizz', token: '--golden-fizz', hex: '#ecfd28', desc: 'High-voltage highlights & live sensor markers' },
        { name: 'Pale Sage', token: '--kidnapper', hex: '#e7ebd3', desc: 'Neutral light card backgrounds & tag chips' },
        { name: 'Champagne Cream', token: '--champagne', hex: '#faf2ce', desc: 'Warm paper texture & metric surfaces' },
        { name: 'Edgewater Mint', token: '--edgewater', hex: '#d1e6e4', desc: 'Clinical Allied Health & NDIS audit headers' },
        { name: 'Bon Jour Offwhite', token: '--bon-jour', hex: '#f6f4f6', desc: 'Light mode primary background canvas' }
      ];

      return (
        <div className="space-y-8">
          {/* Hero Spec Card */}
          <div className="bg-white dark:bg-[#0f172a] p-6 rounded-lg neo-border neo-shadow">
            <div className="flex items-center gap-3 mb-2">
              <span className="text-xs font-mono font-bold uppercase px-2 py-0.5 bg-brand-purple text-white rounded neo-border">
                CANONICAL DESIGN SPEC
              </span>
              <span className="text-xs font-mono text-slate-600 dark:text-slate-400">Document ID: SGG-SPEC-DESIGN-001</span>
            </div>
            <h2 className="text-2xl font-extrabold tracking-tight">Neo-Brutalist High-Performance Standard</h2>
            <p className="text-sm text-slate-600 dark:text-slate-400 mt-2 max-w-3xl leading-relaxed">
              Small Goods Gym completely repudiates generic corporate health trackers. The visual system marries the tactile raw physicality of powerlifting vinyl decals with high-density monospaced velocity data and warm coach marginalia.
            </p>
          </div>

          {/* Webflow Color Tokens Swatch Wall */}
          <div className="bg-white dark:bg-[#0f172a] p-6 rounded-lg neo-border neo-shadow space-y-4">
            <h3 className="text-lg font-extrabold flex items-center justify-between">
              <span>The Official Webflow Color Tokens</span>
              <span className="text-xs font-mono text-slate-600 dark:text-slate-400">Click to copy HEX</span>
            </h3>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
              {colors.map(c => (
                <div
                  key={c.hex}
                  onClick={() => {
                    navigator.clipboard.writeText(c.hex);
                    alert(`Copied ${c.hex} (${c.name}) to clipboard!`);
                  }}
                  className="neo-btn p-3 rounded cursor-pointer bg-white dark:bg-slate-800 text-left transition-transform"
                >
                  <div className="w-full h-12 rounded neo-border mb-2" style={{ backgroundColor: c.hex }}></div>
                  <div className="font-bold text-xs truncate">{c.name}</div>
                  <div className="font-mono text-[11px] text-slate-500">{c.hex}</div>
                  <div className="text-[10px] text-slate-400 truncate mt-1">{c.desc}</div>
                </div>
              ))}
            </div>
          </div>

          {/* The Typography Trio */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-white dark:bg-[#0f172a] p-6 rounded-lg neo-border neo-shadow space-y-3">
              <span className="text-xs font-mono font-bold uppercase px-2 py-0.5 bg-brand-purple text-white rounded neo-border">FONT 01</span>
              <h4 className="text-xl font-extrabold font-sans">Poppins (Sans-Serif)</h4>
              <p className="text-xs text-slate-600 dark:text-slate-400">
                Primary geometric sans-serif used for bold page titles, navigation bars, and heavyweight high-visibility buttons.
              </p>
              <div className="p-3 bg-slate-100 dark:bg-slate-800 rounded font-sans font-bold text-lg">
                ELITE BARBELL VELOCITY
              </div>
            </div>

            <div className="bg-white dark:bg-[#0f172a] p-6 rounded-lg neo-border neo-shadow space-y-3">
              <span className="text-xs font-mono font-bold uppercase px-2 py-0.5 bg-brand-lime text-black rounded neo-border">FONT 02</span>
              <h4 className="text-xl font-extrabold font-mono">Roboto Mono (Monospace)</h4>
              <p className="text-xs text-slate-600 dark:text-slate-400">
                Monospaced technical font for Enode transducer readouts, set numbers, barbell loads (140.0 kg), and audit timestamps.
              </p>
              <div className="p-3 bg-slate-100 dark:bg-slate-800 rounded font-mono font-bold text-lg text-brand-purple dark:text-brand-lime">
                0.68 m/s • 140.0 kg
              </div>
            </div>

            <div className="bg-white dark:bg-[#0f172a] p-6 rounded-lg neo-border neo-shadow space-y-3">
              <span className="text-xs font-mono font-bold uppercase px-2 py-0.5 bg-brand-yellow text-black rounded neo-border">FONT 03</span>
              <h4 className="text-xl font-extrabold font-script text-2xl">Reenie Beanie (Handwritten)</h4>
              <p className="text-xs text-slate-600 dark:text-slate-400">
                Expressive casual script for Joel Mullen's handwritten coaching cues, stance tweaks, and Holly's physio marginalia.
              </p>
              <div className="p-3 bg-brand-yellow text-black rounded font-script text-2xl">
                drive knees outward into the band!
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
