version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: small_goods_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: small_goods_gym
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d small_goods_gym"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: small_goods_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/small_goods_gym
      - JAVIER_AUTH_VERIFY_URL=http://javier-auth-service/api/v1/verify  # Mock URL for Javier's backend validation
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
