<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small Goods Gym — Goat AI Co-Pilot Demo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
    
    :root {
      --purple-heart: #4724ba;
      --electric-violet: #6a3cf4;
      --inch-worm: #9aef0f;
      --golden-fizz: #ecfd28;
      --mandy: #e95766;
      --kidnapper: #e7ebd3;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0914;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Neo-Brutalist Sticker Shadows */
    .neo-card {
      border: 2px solid #000000;
      box-shadow: 4px 4px 0 0 #000000;
      transition: all 0.2s ease;
    }
    .neo-card:hover {
      box-shadow: 6px 6px 0 0 #000000;
      transform: translate(-1px, -1px);
    }
    .neo-card-heavy {
      border: 3px solid #000000;
      box-shadow: 8px 8px 0 0 #000000;
    }
    .neo-btn {
      border: 2px solid #000000;
      box-shadow: 3px 3px 0 0 #000000;
      transition: all 0.15s ease;
    }
    .neo-btn:hover {
      box-shadow: 4px 4px 0 0 #000000;
      transform: translate(-1px, -1px);
    }
    .neo-btn:active {
      box-shadow: 1px 1px 0 0 #000000;
      transform: translate(2px, 2px);
    }

    /* Range slider custom styling */
    input[type=range]::-webkit-slider-thumb {
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #9aef0f;
      border: 2px solid #000000;
      cursor: pointer;
      -webkit-appearance: none;
      box-shadow: 2px 2px 0 #000;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Knowledge Base Data Grounded in Verkhoshansky, Zatsiorsky, Cleather & VBT
    const SOVIET_KNOWLEDGE = {
      verkhoshansky: {
        author: "Yuri Verkhoshansky (Ю.В. Верхошанский)",
        role: "Father of Plyometrics & Pioneer of Special Strength Training",
        keyWorks: ["Supertraining (with Mel Siff)", "Special Strength Training Manual for Coaches (2006)", "Programming & Organization of Training (1985)"],
        principles: [
          {
            title: "Dynamic Correspondence (Динамическое соответствие)",
            summary: "Training exercises must strictly match the target sport across 5 parameters: amplitude/direction, region of accentuated force, dynamics of effort, rate of force development (RFD), and regime of muscular work."
          },
          {
            title: "The Shock Method (Ударный метод)",
            summary: "True depth jumps from 0.50m - 0.75m. Uses involuntary stretch reflex and elastic storage in titin/collagen. Critical rule: amortization phase (eccentric-to-concentric transition) MUST be < 0.15 seconds (150ms) or elastic energy dissipates as heat."
          },
          {
            title: "Leg Primacy in Kinetic Chain",
            summary: "Over 80% of power in Olympic lifting, sprinting, and throwing starts and ends with leg drive. The trunk is a rigid transmission rod; the arms are steering whips. Never cue early arm pulling when a lift stalls."
          }
        ]
      },
      zatsiorsky: {
        author: "Vladimir Zatsiorsky (В.М. Зациорский)",
        role: "World Biomechanist, Soviet Sports Institute Director & Penn State Professor",
        keyWorks: ["Science and Practice of Strength Training (with Kraemer)", "Kinetics of Human Motion", "Biomechanics of the Locomotor System"],
        principles: [
          {
            title: "Maximal Effort Method (ME)",
            summary: "Lifting 90-100% 1RM for 1-3 reps. Recruits highest-threshold fast-twitch motor units (Henneman's Size Principle) and trains rate coding without excessive hypertrophy or metabolic fatigue."
          },
          {
            title: "Repeated Effort Method (RE)",
            summary: "Submaximal loads lifted to failure/near failure. Recruits remaining motor units as initial units fatigue, driving metabolic stress and myofibrillar hypertrophy."
          },
          {
            title: "Dynamic Effort Method (DE)",
            summary: "50-75% 1RM lifted with maximum accelerative intent (a = F/m). Maximizes Rate of Force Development (RFD = dF/dt) and motor unit synchronization."
          }
        ]
      },
      cleather: {
        author: "Dr. Dan Cleather",
        role: "Professor of Biomechanics, St Mary's University London",
        keyWorks: ["Force: The Biomechanics of Training (2021)", "The Little Black Book of Training Wisdom"],
        principles: [
          {
            title: "Joint Torques & Moment Arms (τ = F × d)",
            summary: "Athletes with long femurs have longer horizontal distances from barbell to hip axis in squats. They must widen stance, push knees out, or use low bar to manage lumbar shear."
          },
          {
            title: "Force Vector Specificity",
            summary: "Horizontal vs vertical ground reaction force vectors dictate athletic transference more reliably than exercise names."
          }
        ]
      },
      vbtApps: {
        wlAnalysis: {
          name: "WL Analysis (Weightlifting Analysis)",
          author: "Vladimir Safonov",
          scalePrinciple: "Standard IWF bumper plates have an exact, invariant outer diameter of 450 mm (0.45m). Filming perpendicular (90°) converts pixel diameter into true metric displacement (mm/pixel).",
          metrics: "Bar trajectory (X/Y coordinates), horizontal loop drift (Δx), peak/mean velocity (m/s), catch turnover height."
        },
        myJump: {
          name: "My Jump 2 / My Jump Lab",
          author: "Dr. Carlos Balsalobre-Fernández",
          scalePrinciple: "240 fps slow-motion video. User scrubs video to select Takeoff Frame (toes leave floor) and Landing Frame (first ground touch). Flight time (t) determines jump height: h = 1/8 * g * t^2 ≈ 1.22625 * t^2.",
          validation: "Validated across >15 peer-reviewed studies (r=0.995 agreement with $10,000 Kistler force plates and Optojump)."
        }
      }
    };

    const PRESET_CONVERSATIONS = [
      {
        id: "snatch_miss",
        chipText: "🏋️ Failed 2 Snatches @ 85%",
        userMsg: "Coach, I just missed my last 2 snatch attempts at 85kg (85%). What should I do right now in my session?",
        botReply: "Here is your 90-second Small Goods triage:\n\n1. ⚡ **Velocity Check:** Did the bar feel fast off the floor and you missed the lockout, or did the bar feel like concrete?\n   - **If velocity dropped >15%:** Your CNS is fatigued. Drop load by 5-7.5% immediately (take 80kg for 2 singles) or call the lift.\n   - **If speed was high (>1.65 m/s):** It is a technical timing or bar-loop issue.\n2. 📚 **Verkhoshansky's Anchor:** All power starts and ends in the legs. You are likely pulling early with your arms instead of letting the legs complete the second pull.\n3. 🎯 **Cue from Goat:** *'Stay over the bar 2 inches longer, push the floor through your midfoot, and let the bar brush your hip without bumping it forward.'*"
      },
      {
        id: "long_femurs",
        chipText: "📐 Long Femurs Squat Adjustments",
        userMsg: "My femur-to-torso ratio is 1.14 (femur 51cm, torso 44cm). Why do my squats look like a good morning, and how do I fix it?",
        botReply: "Your leverages explain this objectively through Dan Cleather's joint torque physics:\n\n1. 📐 **The Physics:** A long femur pushes your hip joint far behind the midfoot balance line. To keep the bar over midfoot, your torso MUST lean forward to counterbalance your hips.\n2. 🛠️ **Small Goods Fixes:**\n   - **Widen Stance:** Move your feet to 1.2–1.3× shoulder width.\n   - **Push Knees Out:** Abducting your hips effectively shortens your femur in the sagittal plane, allowing your pelvis to sit closer to the bar.\n   - **Bar Placement:** Shift to low-bar placement (across rear delts) to reduce spinal shear moment arm.\n   - **Footwear:** Add 0.75\" heel elevation (Olympic weightlifting shoes) to increase ankle dorsiflexion tolerance."
      },
      {
        id: "shock_method",
        chipText: "⚡ Verkhoshansky Shock Method",
        userMsg: "Can I do box jumps for plyometrics, or what did Verkhoshansky actually specify for the Shock Method?",
        botReply: "Verkhoshansky was adamant: jumping up onto a high box is NOT true plyometrics.\n\n1. ⚡ **True Plyometrics (Ударный метод):** Depth jumps from a wooden box (0.50m - 0.75m) onto firm ground, followed by an instantaneous maximal vertical or horizontal jump.\n2. ⏱️ **The 150ms Amortization Rule:** Ground contact time MUST be under **0.15 seconds (150ms)**. If your ground contact exceeds 0.20s, the elastic strain energy stored in your titin and tendon collagen dissipates as heat, and you are just doing slow concentric jumping.\n3. 🚫 **Safety Guardrail:** If an athlete cannot squat 1.5× bodyweight with sound mechanics, depth jumps are contraindicated to protect patellar tendons."
      },
      {
        id: "wl_vbt",
        chipText: "📈 WL Analysis & 450mm Bumper Plate Scale",
        userMsg: "How does the WL Analysis app calculate barbell velocity and bar path from video without sensors?",
        botReply: "WL Analysis relies on an invariant physical constant in Olympic weightlifting:\n\n1. 🎯 **The 450mm Calibration Scale:** Every competition IWF bumper plate has an outer diameter of exactly **450 mm (0.45 m)**.\n2. 📸 **Pixel-to-Metric Mapping:** With a camera filming perpendicular (90°) to the bar, the software fits a circle to the outer plate contour: `Scale Factor = 450mm / plate_pixel_diameter`.\n3. 📊 **Kinematic Extraction:** From this invariant metric scale, it derives:\n   - **Bar Path Trajectory:** Horizontal drift loop (Δx). A forward loop >5cm flags excessive hip bumping.\n   - **Velocity (v = Δs/Δt):** Peak and mean velocity curves.\n   - **Turnover Height:** Proves whether you caught in a power position (>80% standing height) or full squat."
      },
      {
        id: "jump_app",
        chipText: "⏱️ My Jump 2 Flight Time Physics",
        userMsg: "How does the slow-motion jump app work that Joel mentioned on the call?",
        botReply: "Joel described **My Jump 2** (by Dr. Carlos Balsalobre-Fernández):\n\n1. 📹 **High-Speed Capture:** Records at 240 fps (1 frame = 4.17 ms).\n2. 🎯 **Two-Frame Selection:**\n   - **Takeoff Frame:** First frame toes lose floor contact.\n   - **Landing Frame:** First frame foot makes initial ground contact.\n3. 🧮 **Ballistic Formula:** Flight time `t` determines height via projectile physics:\n   `h = 1/8 * g * t² ≈ 1.22625 * t² (meters)`.\n4. 🩺 **Clinical Value for Holly Hunt:** In Drop Jumps, it calculates Reactive Strength Index (`RSI = Flight Time / Contact Time`), offering objective data on tendon compliance and fatigue for NDIS capacity building."
      },
      {
        id: "issurin_periodization",
        chipText: "⏱️ How Fast Does Strength Decay? (Issurin RTE)",
        userMsg: "Coach, if I transition into a speed or rehab block, how long do my maximal strength and conditioning gains actually last before decaying?",
        botReply: "Prof. Vladimir Issurin's **Residual Training Effects (RTE)** establish the biological retention windows:\n\n1. 🏋️ **Maximal Strength:** Lasts **30 ± 5 days**. Neural motor unit synchronization and muscle cross-sectional area (CSA) can be fully retained with a single microdose session every 10–14 days.\n2. 🫁 **Aerobic / Tissue Capacity:** Lasts **30 ± 5 days** (capillarization and mitochondrial density persist through transmutation).\n3. ⚡ **Strength-Endurance:** Lasts **18 ± 4 days** (glycolytic buffer capacity requires re-stimulation every 2–3 weeks).\n4. 🏎️ **Maximal Speed & RFD:** Decays in **5 ± 3 days** (alactic enzyme activity and reflex potentiation are highly perishable).\n\n💡 **Coaching Rule:** Joel cycles your blocks knowing we have 4 full weeks of strength retention while focusing on ankle mobility and rate of force development!"
      },
      {
        id: "mann_vbt",
        chipText: "📊 Bryan Mann VBT Velocity Zones",
        userMsg: "What barbell velocity should I aim for on my snatches and squats, and when should I stop a set?",
        botReply: "Dr. Bryan Mann's Mean Concentric Velocity (MCV) zones and fatigue cutoffs:\n\n1. 📈 **The 5 Velocity Zones:**\n   - **Absolute Strength:** `< 0.50 m/s` (85-100% 1RM) — maximal motor unit recruitment.\n   - **Accelerative Strength:** `0.50 - 0.75 m/s` (70-85% 1RM) — moving heavy weight with explosive intent.\n   - **Strength-Speed:** `0.75 - 1.00 m/s` (50-70% 1RM) — peak power sweet spot.\n   - **Speed-Strength:** `1.00 - 1.30 m/s` (30-50% 1RM) — speed prioritized over load.\n   - **Starting Strength:** `> 1.30 m/s` (<30% 1RM) — ballistic alactic power.\n2. 🛑 **Velocity Loss Cutoffs:**\n   - **10% - 20% loss:** Stop set! Ideal for athletic power and sprinting speed with near-zero muscle damage.\n   - **20% - 30% loss:** Functional hypertrophy and strength-endurance.\n   - **> 30% loss:** Immediate termination! Flags severe CNS fatigue and form degradation."
      },
      {
        id: "bondarchuk_transfer",
        chipText: "🎯 Bondarchuk Transfer of Training (CE vs SDE)",
        userMsg: "Why does Joel prioritize pause squats and pin squats over leg extensions for my squat plateau?",
        botReply: "Dr. Anatoliy Bondarchuk's 4-tier taxonomy explains this through the **Transfer Index (T)**:\n\n1. 🏋️ **The 4 Tiers:**\n   - **CE (Competitive Exercise):** 1RM Competition Squat.\n   - **SDE (Special Developmental):** Pause squats, pin squats at sticking point. Duplicates the exact joint angles and neural regimes. Highest transfer index!\n   - **SPE (Special Preparatory):** Good mornings, Romanian deadlifts. Same muscle systems, different trajectory.\n   - **GPE (General Preparatory):** Leg extensions, sleds, cardio machines.\n2. 🔬 **The Elite Transfer Law:** For beginners, everything transfers (even GPE). But as you advance, **transfer from GPE drops to near zero (T ≈ 0)**. Joel uses SDE pin squats because only exercises matching your exact sticking point joint angle will break through your plateau!"
      }
    ];

    function App() {
      const [viewMode, setViewMode] = useState("chat"); // chat | triage | science
      const [messages, setMessages] = useState([
        {
          sender: "bot",
          text: "G'day! I'm the Goat AI Co-Pilot for Small Goods Gym. Grounded in Soviet sports science (Verkhoshansky & Zatsiorsky), barbell VBT, and biomechanical leverages. How can I help your session today?"
        }
      ]);
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);

      // Triage Simulator State
      const [triageExercise, setTriageExercise] = useState("Snatch");
      const [triageLoad, setTriageLoad] = useState(85);
      const [triageMisses, setTriageMisses] = useState(2);
      const [triageVelocityDrop, setTriageVelocityDrop] = useState(18); // percent drop
      const [triageResult, setTriageResult] = useState(null);

      // Auto-scroll chat
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isTyping]);

      // Calculate triage recommendation
      useEffect(() => {
        let action = "";
        let rationale = "";
        let cue = "";
        let badgeColor = "bg-red-500";

        if (triageMisses === 1) {
          action = "Take Full 3-Minute Rest & Repeat Load";
          rationale = "A single miss is within normal technical variability. Do not panic-adjust load.";
          cue = "Focus on floor drive. Power starts in the legs.";
          badgeColor = "bg-yellow-500";
        } else if (triageMisses >= 2) {
          if (triageVelocityDrop >= 15) {
            action = "Immediate 5–7.5% Load Reduction OR Terminate Lift";
            rationale = `Severe velocity decay (${triageVelocityDrop}% drop) signals systemic Central Nervous System (CNS) fatigue. Continuing at this weight ingrains motor recruitment faults (Zatsiorsky).`;
            cue = `Drop to ${(triageLoad * 0.93).toFixed(1)}kg for 2 clean technical singles, then move to accessory pull work.`;
            badgeColor = "bg-rose-600";
          } else {
            action = "Hold Weight, Adjust Technical Leverage";
            rationale = `Bar velocity drop is only ${triageVelocityDrop}% (normal speed). Failure is purely mechanical or timing-based, not systemic fatigue.`;
            cue = "Cue: Stay over the bar longer. Do not pull with elbows early; drive through the floor.";
            badgeColor = "bg-purple-600";
          }
        }

        setTriageResult({ action, rationale, cue, badgeColor });
      }, [triageExercise, triageLoad, triageMisses, triageVelocityDrop]);

      const handleSendMessage = async (textToSend) => {
        const query = textToSend || inputText;
        if (!query.trim()) return;

        const newMessages = [...messages, { sender: "user", text: query }];
        setMessages(newMessages);
        setInputText("");
        setIsTyping(true);

        // 1. Try Live Concierge Bot Engine API
        let botAnswer = null;
        try {
          const apiBase = (window.location.port === "8000" || window.location.pathname.includes("/web/")) ? "" : "http://localhost:8000";
          const res = await fetch(`${apiBase}/api/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: query,
              profile_id: "small_goods_gym",
              conversation_history: newMessages.map(m => ({
                role: m.sender === "user" ? "user" : "assistant",
                content: m.text
              }))
            })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.reply_text) {
              botAnswer = data.reply_text;
            }
          }
        } catch (err) {
          // Graceful fallback to embedded local engine if live server is offline
        }

        // 2. Deterministic Sports Science Fallback if live backend is unreachable
        if (!botAnswer) {
          await new Promise(r => setTimeout(r, 450));
          const lowerQ = query.toLowerCase();

          if (lowerQ.includes("miss") || lowerQ.includes("fail") || lowerQ.includes("85")) {
            botAnswer = PRESET_CONVERSATIONS[0].botReply;
          } else if (lowerQ.includes("femur") || lowerQ.includes("squat") || lowerQ.includes("leverage")) {
            botAnswer = PRESET_CONVERSATIONS[1].botReply;
          } else if (lowerQ.includes("shock") || lowerQ.includes("plyo") || (lowerQ.includes("verkhoshansky") && lowerQ.includes("depth"))) {
            botAnswer = PRESET_CONVERSATIONS[2].botReply;
          } else if (lowerQ.includes("wl") || lowerQ.includes("plate") || lowerQ.includes("450") || lowerQ.includes("vbt")) {
            botAnswer = PRESET_CONVERSATIONS[3].botReply;
          } else if (lowerQ.includes("jump") || lowerQ.includes("flight") || lowerQ.includes("frame")) {
            botAnswer = PRESET_CONVERSATIONS[4].botReply;
          } else if (lowerQ.includes("dynamic correspondence") || lowerQ.includes("динамическое соответствие")) {
            botAnswer = "📖 **From the Sports Science & Biomechanics Library:**\n\n> \"Dynamic correspondence requires the exercise to replicate the kinematic, kinetic, and temporal characteristics of the competition movement—matching amplitude, direction of force, accentuation of maximum force, and the amortization-takeoff regime.\"\n\n— **Yuri Verkhoshansky**, *Special Strength Training: A Practical Manual for Coaches* (p. 91)\n\n💡 **Goat Coaching Translation:** On the platform, don't perform arbitrary accessory work. Choose exercises whose rate of force development (RFD) matches the specific acceleration phase of your lift.";
          } else if (lowerQ.includes("issurin") || lowerQ.includes("periodization") || lowerQ.includes("decay") || lowerQ.includes("rte")) {
            botAnswer = "Vladimir Issurin's Block Periodization sequences Accumulation (hypertrophy/aerobic base), Transmutation (sport-specific strength), and Realization (peaking). Biological decay rates (Residual Training Effects): Maximal Strength lasts 30 ± 5 days; Aerobic Capacity lasts 30 ± 5 days; Strength-Endurance lasts 18 ± 4 days; RFD and Maximal Speed decay within 5 ± 3 days.";
          } else if (lowerQ.includes("mann") || lowerQ.includes("velocity zones") || lowerQ.includes("mcv")) {
            botAnswer = "Dr. Bryan Mann's VBT velocity zones: (1) Absolute Strength: <0.50 m/s (85-100%); (2) Accelerative Strength: 0.50-0.75 m/s (70-85%); (3) Strength-Speed: 0.75-1.00 m/s (50-70%); (4) Speed-Strength: 1.00-1.30 m/s (30-50%); (5) Starting Strength: >1.30 m/s (<30%). Keep velocity loss under 10-20% for explosive power adaptations.";
          } else if (lowerQ.includes("bondarchuk") || lowerQ.includes("transfer") || lowerQ.includes("sde")) {
            botAnswer = "Dr. Anatoliy Bondarchuk's 4-tier Transfer of Training taxonomy: CE (Competitive Exercise), SDE (Special Developmental Exercise - highest transfer), SPE (Special Preparatory Exercise), and GPE (General Preparatory Exercise). Bondarchuk proved that in advanced lifters, GPE transfer approaches zero. Focus on SDEs that match competition motor firing patterns.";
          } else {
            botAnswer = `Based on Small Goods methodology and Soviet strength principles (Verkhoshansky & Zatsiorsky): Every physical adaptation begins with the kinetic chain rooted in the legs. For this specific inquiry on "${query}", ensure your movement amplitude respects your anthropometric femur/torso leverage and maintain rate of force development (RFD). If pain or acute joint restriction is present, this will be routed directly to Holly Hunt for physio triage.`;
          }
        }

        setMessages([...newMessages, { sender: "bot", text: botAnswer }]);
        setIsTyping(false);
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#0b0914] text-slate-100">
          {/* HEADER */}
          <header className="border-b-2 border-black bg-[#161226] sticky top-0 z-40 px-4 py-3 shadow-md">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className="w-11 h-11 rounded-xl bg-gradient-to-tr from-amber-400 via-rose-500 to-purple-700 flex items-center justify-center font-black text-white text-xl border-2 border-black shadow-[2px_2px_0px_#000]">
                  🐐
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-extrabold text-white text-lg tracking-tight">Small Goods Gym</span>
                    <span className="bg-[#9aef0f] text-black text-[10px] font-black px-2 py-0.5 rounded border border-black uppercase font-mono">GOAT AI CO-PILOT</span>
                  </div>
                  <p className="text-xs text-slate-400 font-medium">Soviet Sports Science Grounding & Computer Vision VBT</p>
                </div>
              </div>

              {/* NAVIGATION MODES */}
              <div className="flex items-center space-x-1.5 bg-[#0b0914] p-1 rounded-xl border-2 border-black">
                <button
                  onClick={() => setViewMode("chat")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 ${viewMode === 'chat' ? 'bg-[#4724ba] text-white border border-black shadow-[2px_2px_0px_#000]' : 'text-slate-400 hover:text-white'}`}
                >
                  <span>💬</span>
                  <span>AI Coach Chat</span>
                </button>

                <button
                  onClick={() => setViewMode("triage")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 ${viewMode === 'triage' ? 'bg-[#4724ba] text-white border border-black shadow-[2px_2px_0px_#000]' : 'text-slate-400 hover:text-white'}`}
                >
                  <span>⏱️</span>
                  <span>90-Sec Triage Sim</span>
                </button>

                <button
                  onClick={() => setViewMode("science")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 ${viewMode === 'science' ? 'bg-[#4724ba] text-white border border-black shadow-[2px_2px_0px_#000]' : 'text-slate-400 hover:text-white'}`}
                >
                  <span>📚</span>
                  <span>Soviet Science & VBT</span>
                </button>
              </div>

              <a
                href="live-demo-hub.html"
                className="neo-btn bg-[#9aef0f] text-black text-xs font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1.5"
              >
                <span>⬅️ Back to Live Hub</span>
              </a>
            </div>
          </header>

          {/* MAIN CONTENT */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            {/* VIEW 1: CHAT INTERFACE */}
            {viewMode === "chat" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* LEFT: INTERACTIVE CHAT PANEL */}
                <div className="lg:col-span-8 flex flex-col h-[760px] neo-card bg-[#161226] rounded-2xl overflow-hidden">
                  {/* Chat Top Banner */}
                  <div className="bg-[#211a3b] px-4 py-3 border-b-2 border-black flex items-center justify-between">
                    <div className="flex items-center space-x-2">
                      <span className="w-3 h-3 rounded-full bg-[#9aef0f] animate-pulse"></span>
                      <span className="font-bold text-sm text-white">Live Gym-Floor AI Co-Pilot Session</span>
                    </div>
                    <span className="text-xs font-mono text-purple-300">Grounding: Verkhoshansky • Zatsiorsky • Cleather</span>
                  </div>

                  {/* Message Stream */}
                  <div className="flex-1 overflow-y-auto p-4 space-y-4">
                    {messages.map((m, idx) => (
                      <div
                        key={idx}
                        className={`flex items-start space-x-3 ${m.sender === 'user' ? 'flex-row-reverse space-x-reverse' : ''}`}
                      >
                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center font-bold text-sm shrink-0 border-2 border-black ${m.sender === 'user' ? 'bg-[#4724ba] text-white' : 'bg-[#9aef0f] text-black shadow-[2px_2px_0px_#000]'}`}>
                          {m.sender === 'user' ? '👤' : '🐐'}
                        </div>
                        <div className={`max-w-[82%] rounded-2xl p-4 neo-card ${m.sender === 'user' ? 'bg-[#4724ba] text-white' : 'bg-[#201938] text-slate-100'}`}>
                          <p className="text-xs font-bold text-slate-400 mb-1 font-mono uppercase">
                            {m.sender === 'user' ? 'Alex Carter (Lifter)' : 'The Goat AI Co-Pilot'}
                          </p>
                          <div className="text-sm leading-relaxed whitespace-pre-wrap font-sans">
                            {m.text}
                          </div>
                        </div>
                      </div>
                    ))}
                    {isTyping && (
                      <div className="flex items-center space-x-2 text-slate-400 text-xs font-mono pl-12">
                        <span className="w-2 h-2 rounded-full bg-[#9aef0f] animate-bounce"></span>
                        <span className="w-2 h-2 rounded-full bg-[#9aef0f] animate-bounce [animation-delay:0.2s]"></span>
                        <span className="w-2 h-2 rounded-full bg-[#9aef0f] animate-bounce [animation-delay:0.4s]"></span>
                        <span>Co-Pilot analyzing kinetic chain & VBT parameters...</span>
                      </div>
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  {/* Quick Preset Chips */}
                  <div className="px-4 py-2 bg-[#1b1532] border-t-2 border-black overflow-x-auto flex items-center space-x-2">
                    <span className="text-[11px] font-mono text-slate-400 uppercase font-bold shrink-0">Quick Triage:</span>
                    {PRESET_CONVERSATIONS.map(p => (
                      <button
                        key={p.id}
                        onClick={() => handleSendMessage(p.userMsg)}
                        className="neo-btn bg-[#2b214f] hover:bg-[#3b2d6d] text-white text-xs px-2.5 py-1 rounded-md shrink-0 font-medium"
                      >
                        {p.chipText}
                      </button>
                    ))}
                  </div>

                  {/* Input Box */}
                  <div className="p-3 bg-[#161226] border-t-2 border-black flex items-center space-x-2">
                    <input
                      type="text"
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                      placeholder="Ask the Goat AI (e.g., 'Missed 2 snatches', 'Long femurs squat', 'Shock method height')..."
                      className="flex-1 bg-[#0b0914] border-2 border-black rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#9aef0f]"
                    />
                    <button
                      onClick={() => handleSendMessage()}
                      className="neo-btn bg-[#9aef0f] text-black font-extrabold text-sm px-5 py-2.5 rounded-xl flex items-center space-x-1"
                    >
                      <span>Send</span>
                      <span>⚡</span>
                    </button>
                  </div>
                </div>

                {/* RIGHT: REAL-TIME CONTEXT & GROUNDING PANEL */}
                <div className="lg:col-span-4 space-y-4">
                  {/* Active Lifter Leverage Badge */}
                  <div className="neo-card bg-[#161226] p-4 rounded-2xl">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-mono uppercase text-slate-400 font-bold">Active Lifter Profile</span>
                      <span className="bg-purple-900/60 text-purple-300 text-[10px] px-2 py-0.5 rounded font-mono font-bold border border-purple-500/30">Alex Carter</span>
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-xs font-mono mb-3">
                      <div className="bg-[#0b0914] p-2 rounded-lg border border-black">
                        <span className="text-slate-400 block">Femur / Torso</span>
                        <span className="font-black text-[#9aef0f] text-base">1.18 (#LongFemurs)</span>
                      </div>
                      <div className="bg-[#0b0914] p-2 rounded-lg border border-black">
                        <span className="text-slate-400 block">VBT Snatch Target</span>
                        <span className="font-black text-amber-300 text-base">≥ 1.65 m/s</span>
                      </div>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      Co-Pilot automatically filters all mechanical cues through Alex's long femur leverage and active shoulder impingement record.
                    </p>
                  </div>

                  {/* Strict Guardrail Card */}
                  <div className="neo-card bg-[#211a3b] p-4 rounded-2xl border-l-4 border-l-[#9aef0f]">
                    <div className="flex items-center space-x-2 mb-1">
                      <span className="text-base">🛡️</span>
                      <h4 className="font-extrabold text-white text-sm">Strict Small Business Guardrail</h4>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed mb-2">
                      <strong>Currency is Trust.</strong> The AI Co-Pilot operates under zero-hallucination constraints:
                    </p>
                    <ul className="text-[11px] text-slate-400 space-y-1 list-disc pl-4">
                      <li>Never invents nutritional dosages or rapid cuts.</li>
                      <li>Never cues arm pulling when bar stalling occurs.</li>
                      <li>Immediately routes structural pain to <strong>Holly Hunt</strong> (Physiotherapy).</li>
                    </ul>
                  </div>

                  {/* Soviet Anchor Quote */}
                  <div className="neo-card bg-[#f8ef8d] text-black p-4 rounded-2xl shadow-[4px_4px_0px_#000]">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-black uppercase font-mono tracking-wider">Coach Joel's Sticky Note</span>
                      <span className="text-xs">📌</span>
                    </div>
                    <p className="font-serif italic text-sm leading-snug font-semibold">
                      "All power generation starts and ends with the legs. The arms are an important extension, but it doesn't matter what sport: it's gonna be the legs."
                    </p>
                    <span className="block text-[11px] font-mono font-bold mt-2 text-right">— Yuri Verkhoshansky & Joel Mullen</span>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: 90-SECOND IN-SESSION TRIAGE SIMULATOR */}
            {viewMode === "triage" && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="neo-card-heavy bg-[#161226] p-6 rounded-2xl">
                  <div className="flex items-center justify-between border-b-2 border-black pb-4 mb-6">
                    <div>
                      <h2 className="text-xl font-black text-white flex items-center space-x-2">
                        <span>⏱️</span>
                        <span>90-Second In-Session Triage Simulator</span>
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">
                        Deterministic decision-tree that runs on the gym floor when a lifter misses consecutive attempts.
                      </p>
                    </div>
                    <span className="bg-[#9aef0f] text-black text-xs font-black px-3 py-1 rounded-md border border-black uppercase font-mono">
                      ZERO GUESSWORK
                    </span>
                  </div>

                  {/* CONTROLS */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    {/* Exercise Select */}
                    <div className="space-y-2">
                      <label className="text-xs font-mono uppercase text-slate-400 font-bold block">Current Exercise</label>
                      <div className="grid grid-cols-3 gap-2">
                        {["Snatch", "Clean & Jerk", "Back Squat"].map(ex => (
                          <button
                            key={ex}
                            onClick={() => setTriageExercise(ex)}
                            className={`py-2 px-3 rounded-xl text-xs font-bold border-2 border-black transition-all ${triageExercise === ex ? 'bg-[#4724ba] text-white shadow-[2px_2px_0px_#000]' : 'bg-[#0b0914] text-slate-400 hover:text-white'}`}
                          >
                            {ex}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Prescribed Working Load */}
                    <div className="space-y-2">
                      <div className="flex justify-between items-center">
                        <label className="text-xs font-mono uppercase text-slate-400 font-bold">Barbell Load</label>
                        <span className="font-mono text-base font-black text-[#9aef0f]">{triageLoad} kg</span>
                      </div>
                      <input
                        type="range"
                        min="40"
                        max="180"
                        value={triageLoad}
                        onChange={(e) => setTriageLoad(Number(e.target.value))}
                        className="w-full bg-slate-800 rounded-lg h-2 appearance-none cursor-pointer"
                      />
                    </div>

                    {/* Miss Count */}
                    <div className="space-y-2">
                      <label className="text-xs font-mono uppercase text-slate-400 font-bold block">Consecutive Missed Reps</label>
                      <div className="grid grid-cols-3 gap-2">
                        {[1, 2, 3].map(cnt => (
                          <button
                            key={cnt}
                            onClick={() => setTriageMisses(cnt)}
                            className={`py-2 px-3 rounded-xl text-xs font-bold border-2 border-black transition-all ${triageMisses === cnt ? 'bg-rose-600 text-white shadow-[2px_2px_0px_#000]' : 'bg-[#0b0914] text-slate-400 hover:text-white'}`}
                          >
                            {cnt} {cnt === 1 ? 'Miss' : 'Misses'}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Measured Bar Velocity Drop */}
                    <div className="space-y-2">
                      <div className="flex justify-between items-center">
                        <label className="text-xs font-mono uppercase text-slate-400 font-bold">Bar Velocity Decay (Δv)</label>
                        <span className={`font-mono text-base font-black ${triageVelocityDrop >= 15 ? 'text-rose-400' : 'text-[#9aef0f]'}`}>
                          -{triageVelocityDrop}% {triageVelocityDrop >= 15 ? '(CNS Fatigue)' : '(Speed Maintained)'}
                        </span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="35"
                        value={triageVelocityDrop}
                        onChange={(e) => setTriageVelocityDrop(Number(e.target.value))}
                        className="w-full bg-slate-800 rounded-lg h-2 appearance-none cursor-pointer"
                      />
                      <div className="flex justify-between text-[10px] text-slate-500 font-mono">
                        <span>0% (Fast)</span>
                        <span className="text-rose-400 font-bold">15% Threshold</span>
                        <span>35% (Concrete)</span>
                      </div>
                    </div>
                  </div>

                  {/* DETERMINISTIC OUTPUT CARD */}
                  {triageResult && (
                    <div className="neo-card bg-[#211a3b] p-6 rounded-2xl border-2 border-black">
                      <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center space-x-2">
                          <span className={`w-3.5 h-3.5 rounded-full ${triageResult.badgeColor} animate-pulse`}></span>
                          <span className="font-mono text-xs uppercase font-bold text-slate-400">Prescribed Coach Action</span>
                        </div>
                        <span className={`text-xs font-extrabold px-3 py-1 rounded text-white ${triageResult.badgeColor} border border-black shadow-[2px_2px_0px_#000]`}>
                          {triageResult.action}
                        </span>
                      </div>

                      <div className="space-y-3">
                        <div className="bg-[#0b0914] p-4 rounded-xl border border-black">
                          <span className="text-xs font-mono text-slate-400 uppercase font-bold block mb-1">Scientific Rationale:</span>
                          <p className="text-sm text-slate-200 leading-relaxed">{triageResult.rationale}</p>
                        </div>

                        <div className="bg-[#f8ef8d] p-4 rounded-xl border-2 border-black text-black">
                          <span className="text-xs font-mono text-black uppercase font-black block mb-1">Coach Cues to Athlete:</span>
                          <p className="text-sm font-semibold leading-relaxed">{triageResult.cue}</p>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* VIEW 3: SOVIET SCIENCE & COMPUTER VISION LAB */}
            {viewMode === "science" && (
              <div className="space-y-8">
                {/* Soviet Giants Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* Yuri Verkhoshansky */}
                  <div className="neo-card-heavy bg-[#161226] p-6 rounded-2xl">
                    <div className="flex items-start justify-between border-b-2 border-black pb-3 mb-4">
                      <div>
                        <span className="text-xs font-mono font-bold text-purple-400 uppercase">Soviet Sports Science</span>
                        <h3 className="text-xl font-black text-white">{SOVIET_KNOWLEDGE.verkhoshansky.author}</h3>
                        <p className="text-xs text-slate-400">{SOVIET_KNOWLEDGE.verkhoshansky.role}</p>
                      </div>
                      <span className="text-2xl">📖</span>
                    </div>

                    <div className="space-y-4">
                      {SOVIET_KNOWLEDGE.verkhoshansky.principles.map((pr, i) => (
                        <div key={i} className="bg-[#0b0914] p-3.5 rounded-xl border border-black">
                          <h4 className="text-sm font-bold text-[#9aef0f] mb-1">{pr.title}</h4>
                          <p className="text-xs text-slate-300 leading-relaxed">{pr.summary}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Vladimir Zatsiorsky */}
                  <div className="neo-card-heavy bg-[#161226] p-6 rounded-2xl">
                    <div className="flex items-start justify-between border-b-2 border-black pb-3 mb-4">
                      <div>
                        <span className="text-xs font-mono font-bold text-purple-400 uppercase">Soviet Sports Science</span>
                        <h3 className="text-xl font-black text-white">{SOVIET_KNOWLEDGE.zatsiorsky.author}</h3>
                        <p className="text-xs text-slate-400">{SOVIET_KNOWLEDGE.zatsiorsky.role}</p>
                      </div>
                      <span className="text-2xl">🔬</span>
                    </div>

                    <div className="space-y-4">
                      {SOVIET_KNOWLEDGE.zatsiorsky.principles.map((pr, i) => (
                        <div key={i} className="bg-[#0b0914] p-3.5 rounded-xl border border-black">
                          <h4 className="text-sm font-bold text-amber-300 mb-1">{pr.title}</h4>
                          <p className="text-xs text-slate-300 leading-relaxed">{pr.summary}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Computer Vision Kinematics Apps Breakdown */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* WL Analysis App */}
                  <div className="neo-card bg-[#211a3b] p-6 rounded-2xl border-2 border-black">
                    <div className="flex items-center space-x-2 mb-3">
                      <span className="text-xl">🏋️</span>
                      <h3 className="text-lg font-black text-white">WL Analysis (Plate Calibration Mechanics)</h3>
                    </div>
                    <div className="bg-[#0b0914] p-4 rounded-xl border border-black mb-4">
                      <div className="flex justify-between text-xs font-mono mb-2">
                        <span className="text-slate-400">Standard Bumper Plate</span>
                        <span className="font-bold text-[#9aef0f]">450 mm (Exact)</span>
                      </div>
                      <div className="h-10 bg-slate-900 rounded-lg flex items-center justify-center border border-slate-700 font-mono text-xs text-slate-300">
                        Scale = 450mm / Bumper_Diameter_in_Pixels
                      </div>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed mb-3">
                      {SOVIET_KNOWLEDGE.vbtApps.wlAnalysis.scalePrinciple}
                    </p>
                    <div className="text-[11px] font-mono text-purple-300 bg-[#161226] p-2.5 rounded-lg border border-black">
                      Outputs: {SOVIET_KNOWLEDGE.vbtApps.wlAnalysis.metrics}
                    </div>
                  </div>

                  {/* My Jump 2 App */}
                  <div className="neo-card bg-[#211a3b] p-6 rounded-2xl border-2 border-black">
                    <div className="flex items-center space-x-2 mb-3">
                      <span className="text-xl">⏱️</span>
                      <h3 className="text-lg font-black text-white">My Jump 2 (High-FPS Flight-Time Physics)</h3>
                    </div>
                    <div className="bg-[#0b0914] p-4 rounded-xl border border-black mb-4">
                      <div className="flex justify-between text-xs font-mono mb-2">
                        <span className="text-slate-400">Ballistic Parabolic Equation</span>
                        <span className="font-bold text-amber-300">h = 1/8 · g · t²</span>
                      </div>
                      <div className="h-10 bg-slate-900 rounded-lg flex items-center justify-center border border-slate-700 font-mono text-xs text-amber-300">
                        Jump Height (h) ≈ 1.22625 × (t_flight)²
                      </div>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed mb-3">
                      {SOVIET_KNOWLEDGE.vbtApps.myJump.scalePrinciple}
                    </p>
                    <div className="text-[11px] font-mono text-amber-300 bg-[#161226] p-2.5 rounded-lg border border-black">
                      Validation: {SOVIET_KNOWLEDGE.vbtApps.myJump.validation}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
