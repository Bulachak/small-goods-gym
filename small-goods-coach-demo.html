                        <span className="w-2 h-2 rounded-full bg-[#9aef0f] animate-bounce"></span>
                        <span className="w-2 h-2 rounded-full bg-[#9aef0f] animate-bounce [animation-delay:0.2s]"></span>
                        <span className="w-2 h-2 rounded-full bg-[#9aef0f] animate-bounce [animation-delay:0.4s]"></span>
                        <span>Co-Pilot analyzing kinetic chain & VBT parameters...</span>
                      </div>
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  {/* Quick Suggested Prompts Carousel */}
                  <div className="px-4 py-2 bg-[#1b1532] border-t-2 border-black overflow-x-auto flex items-center space-x-2">
                    <span className="text-[11px] font-mono text-slate-400 uppercase font-bold shrink-0">Try Asking:</span>
                    {PRESET_CONVERSATIONS.map(p => (
                      <button
                        key={p.id}
                        onClick={() => handleSendMessage(p.userMsg)}
                        className="neo-btn bg-[#2b214f] hover:bg-[#3b2d6d] text-white text-xs px-2.5 py-1 rounded-md shrink-0 font-medium"
                      >
                        {p.chipText}
                      </button>
                    ))}
                  </div>

                  {/* Input Box */}
                  <div className="p-3 bg-[#161226] border-t-2 border-black flex items-center space-x-2">
                    <input
                      type="text"
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                      placeholder="Ask Goat AI anything (e.g. 'Can I bring my kids?', 'Missed lift triage', 'Squat stance', 'Best shoes')..."
                      className="flex-1 bg-[#0b0914] border-2 border-black rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#9aef0f]"
                    />
                    <button
                      onClick={() => handleSendMessage()}
                      className="neo-btn bg-[#9aef0f] text-black font-extrabold text-sm px-5 py-2.5 rounded-xl flex items-center space-x-1"
                    >
                      <span>Send</span>
                      <span>⚡</span>
                    </button>
                  </div>
                </div>

                {/* RIGHT: REAL-TIME CONTEXT & GROUNDING PANEL */}
                <div className="lg:col-span-4 space-y-4">
                  {/* Active Lifter Leverage Badge */}
                  <div className="neo-card bg-[#161226] p-4 rounded-2xl">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-mono uppercase text-slate-400 font-bold">Active Lifter Profile</span>
                      <span className="bg-purple-900/60 text-purple-300 text-[10px] px-2 py-0.5 rounded font-mono font-bold border border-purple-500/30">Alex Carter</span>
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-xs font-mono mb-3">
                      <div className="bg-[#0b0914] p-2 rounded-lg border border-black">
                        <span className="text-slate-400 block">Femur / Torso</span>
                        <span className="font-black text-[#9aef0f] text-base">1.18 (#LongFemurs)</span>
                      </div>
                      <div className="bg-[#0b0914] p-2 rounded-lg border border-black">
                        <span className="text-slate-400 block">Coaching Tone</span>
                        <span className="font-black text-amber-300 text-base">Accessible & Warm</span>
                      </div>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed mb-2">
                      Co-Pilot automatically switches between intuitive sensory metaphors for gym beginners and joint-moment physics for national lifters.
                    </p>
                    <div className="flex items-center space-x-1.5 text-[10px] font-mono text-[#9aef0f] bg-[#0b0914] p-1.5 rounded border border-black">
                      <span>✓</span>
                      <span>Universal Progressive Disclosure Active</span>
                    </div>
                  </div>

                  {/* Strict Guardrail Card */}
                  <div className="neo-card bg-[#211a3b] p-4 rounded-2xl border-l-4 border-l-[#9aef0f]">
                    <div className="flex items-center space-x-2 mb-1">
                      <span className="text-base">🛡️</span>
                      <h4 className="font-extrabold text-white text-sm">Strict Small Business Guardrail</h4>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed mb-2">
                      <strong>Currency is Trust.</strong> The AI Co-Pilot operates under zero-hallucination constraints:
                    </p>
                    <ul className="text-[11px] text-slate-400 space-y-1 list-disc pl-4">
                      <li>Never dumps uninvited academic jargon on everyday lifters.</li>
                      <li>Translates science into sensory somatic cues first.</li>
                      <li>Immediately routes structural pain to <strong>Holly Hunt</strong> (Physiotherapy).</li>
                    </ul>
                  </div>

                  {/* Coach Joel's Sticky Note */}
                  <div className="neo-card bg-[#f8ef8d] text-black p-4 rounded-2xl shadow-[4px_4px_0px_#000]">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-black uppercase font-mono tracking-wider">Coach Joel's North Star</span>
                      <span className="text-xs">📌</span>
                    </div>
                    <p className="font-serif italic text-sm leading-snug font-bold mb-2">
                      "Good training starts with seeing the person in front of you. Be a safe place for a 'misfit' community."
                    </p>
                    <p className="font-serif italic text-xs leading-snug text-slate-800">
                      "All power generation starts and ends with the legs. The arms are an important extension, but it doesn't matter what sport: it's gonna be the legs."
                    </p>
                    <span className="block text-[11px] font-mono font-bold mt-2 text-right">— Joel Mullen & Yuri Verkhoshansky</span>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 2: 90-SECOND IN-SESSION TRIAGE SIMULATOR */}
            {viewMode === "triage" && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="neo-card-heavy bg-[#161226] p-6 rounded-2xl">
                  <div className="flex items-center justify-between border-b-2 border-black pb-4 mb-6">
                    <div>
                      <h2 className="text-xl font-black text-white flex items-center space-x-2">
                        <span>⏱️</span>
                        <span>90-Second In-Session Triage Simulator</span>
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">
                        Deterministic decision-tree that runs on the gym floor when a lifter misses consecutive attempts.
                      </p>
                    </div>
                    <span className="bg-[#9aef0f] text-black text-xs font-black px-3 py-1 rounded-md border border-black uppercase font-mono">
                      ZERO GUESSWORK
                    </span>
                  </div>

                  {/* CONTROLS */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    {/* Exercise Select */}
                    <div className="space-y-2">
                      <label className="text-xs font-mono uppercase text-slate-400 font-bold block">Current Exercise</label>
                      <div className="grid grid-cols-3 gap-2">
                        {["Snatch", "Clean & Jerk", "Back Squat"].map(ex => (
                          <button
                            key={ex}
                            onClick={() => setTriageExercise(ex)}
                            className={`py-2 px-3 rounded-xl text-xs font-bold border-2 border-black transition-all ${triageExercise === ex ? 'bg-[#4724ba] text-white shadow-[2px_2px_0px_#000]' : 'bg-[#0b0914] text-slate-400 hover:text-white'}`}
                          >
                            {ex}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Prescribed Working Load */}
                    <div className="space-y-2">
                      <div className="flex justify-between items-center">
                        <label className="text-xs font-mono uppercase text-slate-400 font-bold">Barbell Load</label>
                        <span className="font-mono text-base font-black text-[#9aef0f]">{triageLoad} kg</span>
                      </div>
                      <input
                        type="range"
                        min="40"
                        max="180"
                        value={triageLoad}
                        onChange={(e) => setTriageLoad(Number(e.target.value))}
                        className="w-full bg-slate-800 rounded-lg h-2 appearance-none cursor-pointer"
                      />
                    </div>

                    {/* Miss Count */}
                    <div className="space-y-2">
                      <label className="text-xs font-mono uppercase text-slate-400 font-bold block">Consecutive Missed Reps</label>
                      <div className="grid grid-cols-3 gap-2">
                        {[1, 2, 3].map(cnt => (
                          <button
                            key={cnt}
                            onClick={() => setTriageMisses(cnt)}
                            className={`py-2 px-3 rounded-xl text-xs font-bold border-2 border-black transition-all ${triageMisses === cnt ? 'bg-rose-600 text-white shadow-[2px_2px_0px_#000]' : 'bg-[#0b0914] text-slate-400 hover:text-white'}`}
                          >
                            {cnt} {cnt === 1 ? 'Miss' : 'Misses'}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Measured Bar Velocity Drop */}
                    <div className="space-y-2">
                      <div className="flex justify-between items-center">
                        <label className="text-xs font-mono uppercase text-slate-400 font-bold">Bar Velocity Decay (Δv)</label>
                        <span className={`font-mono text-base font-black ${triageVelocityDrop >= 15 ? 'text-rose-400' : 'text-[#9aef0f]'}`}>
                          -{triageVelocityDrop}% {triageVelocityDrop >= 15 ? '(CNS Fatigue)' : '(Speed Maintained)'}
                        </span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="35"
                        value={triageVelocityDrop}
                        onChange={(e) => setTriageVelocityDrop(Number(e.target.value))}
                        className="w-full bg-slate-800 rounded-lg h-2 appearance-none cursor-pointer"
                      />
                      <div className="flex justify-between text-[10px] text-slate-500 font-mono">
                        <span>0% (Fast)</span>
                        <span className="text-rose-400 font-bold">15% Threshold</span>
                        <span>35% (Concrete)</span>
                      </div>
                    </div>
                  </div>

                  {/* DETERMINISTIC OUTPUT CARD */}
                  {triageResult && (
                    <div className="neo-card bg-[#211a3b] p-6 rounded-2xl border-2 border-black">
                      <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center space-x-2">
                          <span className={`w-3.5 h-3.5 rounded-full ${triageResult.badgeColor} animate-pulse`}></span>
                          <span className="font-mono text-xs uppercase font-bold text-slate-400">Prescribed Coach Action</span>
                        </div>
                        <span className={`text-xs font-extrabold px-3 py-1 rounded text-white ${triageResult.badgeColor} border border-black shadow-[2px_2px_0px_#000]`}>
                          {triageResult.action}
                        </span>
                      </div>

                      <div className="space-y-3">
                        <div className="bg-[#0b0914] p-4 rounded-xl border border-black">
                          <span className="text-xs font-mono text-slate-400 uppercase font-bold block mb-1">Scientific Rationale:</span>
                          <p className="text-sm text-slate-200 leading-relaxed">{triageResult.rationale}</p>
                        </div>

                        <div className="bg-[#f8ef8d] p-4 rounded-xl border-2 border-black text-black">
                          <span className="text-xs font-mono text-black uppercase font-black block mb-1">Coach Cues to Athlete:</span>
                          <p className="text-sm font-semibold leading-relaxed">{triageResult.cue}</p>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* VIEW 3: SOVIET SCIENCE & COMPUTER VISION LAB */}
            {viewMode === "science" && (
              <div className="space-y-8">
                {/* Soviet Giants Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* Yuri Verkhoshansky */}
                  <div className="neo-card-heavy bg-[#161226] p-6 rounded-2xl">
                    <div className="flex items-start justify-between border-b-2 border-black pb-3 mb-4">
                      <div>
                        <span className="text-xs font-mono font-bold text-purple-400 uppercase">Soviet Sports Science</span>
                        <h3 className="text-xl font-black text-white">{SOVIET_KNOWLEDGE.verkhoshansky.author}</h3>
                        <p className="text-xs text-slate-400">{SOVIET_KNOWLEDGE.verkhoshansky.role}</p>
                      </div>
                      <span className="text-2xl">📖</span>
                    </div>

                    <div className="space-y-4">
                      {SOVIET_KNOWLEDGE.verkhoshansky.principles.map((pr, i) => (
                        <div key={i} className="bg-[#0b0914] p-3.5 rounded-xl border border-black">
                          <h4 className="text-sm font-bold text-[#9aef0f] mb-1">{pr.title}</h4>
                          <p className="text-xs text-slate-300 leading-relaxed">{pr.summary}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Vladimir Zatsiorsky */}
                  <div className="neo-card-heavy bg-[#161226] p-6 rounded-2xl">
                    <div className="flex items-start justify-between border-b-2 border-black pb-3 mb-4">
                      <div>
                        <span className="text-xs font-mono font-bold text-purple-400 uppercase">Soviet Sports Science</span>
                        <h3 className="text-xl font-black text-white">{SOVIET_KNOWLEDGE.zatsiorsky.author}</h3>
                        <p className="text-xs text-slate-400">{SOVIET_KNOWLEDGE.zatsiorsky.role}</p>
                      </div>
                      <span className="text-2xl">🔬</span>
                    </div>

                    <div className="space-y-4">
                      {SOVIET_KNOWLEDGE.zatsiorsky.principles.map((pr, i) => (
                        <div key={i} className="bg-[#0b0914] p-3.5 rounded-xl border border-black">
                          <h4 className="text-sm font-bold text-amber-300 mb-1">{pr.title}</h4>
                          <p className="text-xs text-slate-300 leading-relaxed">{pr.summary}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Computer Vision Kinematics Apps Breakdown */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* WL Analysis App */}
                  <div className="neo-card bg-[#211a3b] p-6 rounded-2xl border-2 border-black">
                    <div className="flex items-center space-x-2 mb-3">
                      <span className="text-xl">🏋️</span>
                      <h3 className="text-lg font-black text-white">WL Analysis (Plate Calibration Mechanics)</h3>
                    </div>
                    <div className="bg-[#0b0914] p-4 rounded-xl border border-black mb-4">
                      <div className="flex justify-between text-xs font-mono mb-2">
                        <span className="text-slate-400">Standard Bumper Plate</span>
                        <span className="font-bold text-[#9aef0f]">450 mm (Exact)</span>
                      </div>
                      <div className="h-10 bg-slate-900 rounded-lg flex items-center justify-center border border-slate-700 font-mono text-xs text-slate-300">
                        Scale = 450mm / Bumper_Diameter_in_Pixels
                      </div>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed mb-3">
                      {SOVIET_KNOWLEDGE.vbtApps.wlAnalysis.scalePrinciple}
                    </p>
                    <div className="text-[11px] font-mono text-purple-300 bg-[#161226] p-2.5 rounded-lg border border-black">
                      Outputs: {SOVIET_KNOWLEDGE.vbtApps.wlAnalysis.metrics}
                    </div>
                  </div>

                  {/* My Jump 2 App */}
                  <div className="neo-card bg-[#211a3b] p-6 rounded-2xl border-2 border-black">
                    <div className="flex items-center space-x-2 mb-3">
                      <span className="text-xl">⏱️</span>
                      <h3 className="text-lg font-black text-white">My Jump 2 (High-FPS Flight-Time Physics)</h3>
                    </div>
                    <div className="bg-[#0b0914] p-4 rounded-xl border border-black mb-4">
                      <div className="flex justify-between text-xs font-mono mb-2">
                        <span className="text-slate-400">Ballistic Parabolic Equation</span>
                        <span className="font-bold text-amber-300">h = 1/8 · g · t²</span>
                      </div>
                      <div className="h-10 bg-slate-900 rounded-lg flex items-center justify-center border border-slate-700 font-mono text-xs text-amber-300">
                        Jump Height (h) ≈ 1.22625 × (t_flight)²
                      </div>
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed mb-3">
                      {SOVIET_KNOWLEDGE.vbtApps.myJump.scalePrinciple}
                    </p>
                    <div className="text-[11px] font-mono text-amber-300 bg-[#161226] p-2.5 rounded-lg border border-black">
                      Validation: {SOVIET_KNOWLEDGE.vbtApps.myJump.validation}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
